name: zkApp tests
env:
  MINA_NETWORK_DOMAIN: testnet
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: minaguard
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      #
      # Enable the following block if you also want to use the Lightnet in your tests.
      #
      # - name: Wait for Mina network readiness
      #   uses: o1-labs/wait-for-mina-network-action@v1
      #   with:
      #     mina-graphql-port: 8080
      #     max-attempts: 60
      #     polling-interval-ms: 10000

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
      - name: Git checkout
        uses: actions/checkout@v6
        with:
          submodules: true
      - name: Check VK input fingerprint
        run: bash contracts/scripts/vk-input-fingerprint.test.sh
      - name: Install dependencies
        run: bun install
      # schema.sqlite.prisma (desktop) must mirror schema.prisma (backend).
      # Drift only breaks the desktop build, which no other job here exercises.
      - name: Check Prisma schema sync (postgres <-> sqlite)
        run: bun run --filter backend prisma:check-schema-sync
      - name: Build contracts
        run: bun run --filter contracts build
      - name: Run UI unit tests
        run: bun run --filter ui test
      - name: Run desktop unit tests
        run: bun run --filter desktop test
      - name: Build UI
        run: bun run --filter ui build
        env:
          NEXT_PUBLIC_MINA_NETWORK: testnet
      - name: Test incremental event transport
        run: bun run --filter e2e test:unit
        env:
          NEXT_PUBLIC_MINA_NETWORK: testnet
      - name: Generate Prisma client
        run: cd backend && bunx prisma generate
      - name: Build backend
        run: bun run --filter backend build
      - name: Run contract tests
        run: bun run test
        env:
          CI: true
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/minaguard
      - name: Run backend tests
        # All backend suites against a fresh Postgres. Test files that
        # mock.module mina-client re-register the real module in afterAll —
        # bun module mocks are process-global, and CI's file order differs
        # from local, so a leaked stub broke mina-client-tx-status here.
        run: |
          cd backend
          bunx prisma db push --force-reset --skip-generate
          bun test src/tests/
        env:
          CI: true
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/minaguard
      - name: Run offline-cli tests
        run: cd offline-cli && bun test
        env:
          SKIP_PROOFS: '1'
      - name: Build offline-cli binary (linux-x64)
        run: cd offline-cli && bun build --compile --target=bun-linux-x64 src/index.ts --outfile dist/mina-guard-cli-linux-x64 --define 'process.versions.node=""'
      - name: Smoke-test compiled binary (WASM loads without error)
        run: |
          output=$(offline-cli/dist/mina-guard-cli-linux-x64 2>&1 || true)
          echo "$output"
          echo "$output" | grep -q "Usage:" || (echo "ERROR: binary did not print usage — WASM may have failed to load" && exit 1)

  test-offline-cli-macos:
    timeout-minutes: 45
    runs-on: macos-latest
    steps:
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
      - name: Git checkout
        uses: actions/checkout@v6
        with:
          submodules: true
      - name: Install dependencies
        run: bun install --ignore-scripts
      - name: Build mina-signer
        working-directory: ui/deps/o1js/src/mina-signer
        run: bunx esbuild --bundle --minify mina-signer.ts --outfile=./dist/web/index.js --format=esm --target=es2021 --platform=browser --external:crypto --external:@noble/hashes/* --external:blakejs --external:js-sha256
      - name: Build contracts
        run: bun run --filter contracts build
      - name: Run offline-cli unit tests
        working-directory: offline-cli
        run: bun test src/tests/offline-cli.test.ts
      - name: Run offline-cli e2e test (with proofs)
        working-directory: offline-cli
        run: bun test src/tests/offline-cli-e2e.test.ts --test-name-pattern "propose"
        timeout-minutes: 20
      - name: Build offline-cli binary (darwin-arm64)
        working-directory: offline-cli
        run: bun build --compile --target=bun-darwin-arm64 src/index.ts --outfile dist/mina-guard-cli-darwin-arm64 --define 'process.versions.node=""'
      - name: Code-sign binary (JIT entitlement required for WASM)
        working-directory: offline-cli
        run: |
          cat > /tmp/entitlements.plist << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>com.apple.security.cs.allow-jit</key>
            <true/>
            <key>com.apple.security.cs.allow-unsigned-executable-memory</key>
            <true/>
          </dict>
          </plist>
          PLIST
          codesign -s - --force --entitlements /tmp/entitlements.plist dist/mina-guard-cli-darwin-arm64
      - name: Smoke-test compiled binary (WASM loads without error)
        working-directory: offline-cli
        run: |
          output=$(./dist/mina-guard-cli-darwin-arm64 2>&1 || true)
          echo "$output"
          echo "$output" | grep -q "Usage:" || (echo "ERROR: binary did not print usage — WASM may have failed to load" && exit 1)

  # Generate the two distinct circuit hashes on separate runners. Devnet shares
  # the testnet circuit. Each runner proves a different lifecycle after compiling.
  generate-vk-hashes:
    uses: ./.github/workflows/vk-hashes.yml
    with:
      run-proof-tests: true

  # Keep the required branch-protection check name while compilation and proof
  # checks run inside the reusable workflow.
  check-vk-hash:
    needs: generate-vk-hashes
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require generated VKs and genuine proofs
        env:
          VK_RESULT: ${{ needs.generate-vk-hashes.result }}
        run: test "$VK_RESULT" = success

  test-offline-cli-windows:
    timeout-minutes: 45
    runs-on: windows-latest
    steps:
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
      - name: Git checkout
        uses: actions/checkout@v6
        with:
          submodules: true
      - name: Install dependencies
        run: bun install --ignore-scripts
      - name: Build mina-signer
        working-directory: ui/deps/o1js/src/mina-signer
        run: bunx esbuild --bundle --minify mina-signer.ts --outfile=./dist/web/index.js --format=esm --target=es2021 --platform=browser --external:crypto --external:@noble/hashes/* --external:blakejs --external:js-sha256
      - name: Build contracts
        run: bun run --filter contracts build
      - name: Run offline-cli unit tests
        working-directory: offline-cli
        run: bun test src/tests/offline-cli.test.ts
      - name: Run offline-cli e2e test (with proofs)
        working-directory: offline-cli
        run: bun test src/tests/offline-cli-e2e.test.ts --test-name-pattern "propose"
        timeout-minutes: 20
      - name: Build offline-cli binary (win32-x64)
        working-directory: offline-cli
        run: bun build --compile --target=bun-win32-x64 src/index.ts --outfile dist/mina-guard-cli-win32-x64 --define 'process.versions.node=""'
      - name: Smoke-test compiled binary (WASM loads without error)
        working-directory: offline-cli
        shell: bash
        run: |
          output=$(./dist/mina-guard-cli-win32-x64.exe 2>&1 || true)
          echo "$output"
          echo "$output" | grep -q "Usage:" || (echo "ERROR: binary did not print usage — WASM may have failed to load" && exit 1)

  test-ui:
    timeout-minutes: 30
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: minaguard_uitest
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
      - name: Git checkout
        uses: actions/checkout@v6
        with:
          submodules: true
      - name: Install dependencies
        run: bun install
      - name: Build contracts
        run: bun run --filter contracts build
      - name: Generate Prisma client
        run: cd backend && bunx prisma generate
      - name: Install Playwright browsers
        run: cd e2e && bunx playwright install --with-deps chromium
      - name: Run transaction preparation worker regression
        run: bun e2e/preflight/worker-preparation.ts
      - name: Run transaction preflight browser checks
        run: bun e2e/preflight/browser.ts
      - name: Run preflight polling regression tests
        run: bun test e2e/browser/preflight-check.test.ts
      - name: Run UI test suite
        run: cd e2e && bun run test:ui
        env:
          E2E_UI_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/minaguard_uitest
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-results
          path: e2e/test-results/
