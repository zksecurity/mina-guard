name: Check mainnet production promotion

# This workflow runs trusted production-branch code. Never check out or execute
# the proposed PR head. Inspect its Git objects as data only.
on:
  pull_request_target:
    branches: [production]
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read
  pull-requests: read
  actions: read
  packages: read
  attestations: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Check release promotion or maintenance sync
        id: change
        run: |
          set -euo pipefail
          python3 deploy/check-production-pr.py --pr-number "$PR_NUMBER" \
            --head-sha "$HEAD_SHA" --base-sha "$BASE_SHA" \
            --record-output "$RUNNER_TEMP/production-release.json"
      - name: Authenticate for release image verification
        if: steps.change.outputs.kind == 'promotion'
        env:
          REGISTRY_USER: ${{ github.actor }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$REGISTRY_USER" --password-stdin
      - name: Verify the selected build and exact manifest
        if: steps.change.outputs.kind == 'promotion'
        run: |
          set -euo pipefail
          python3 deploy/production-promotion.py \
            --record "$RUNNER_TEMP/production-release.json"
