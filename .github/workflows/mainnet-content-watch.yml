name: Mainnet public-content watch

# Runs on GitHub-hosted infrastructure, outside the frontend server. The
# expected release comes from the last successful ops-authored deployment.
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Check the live release or a restricted pre-launch preview
        required: true
        type: choice
        options: [production, preview]
        default: production

concurrency:
  group: mainnet-content-watch
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  packages: read
  attestations: read
  deployments: read

jobs:
  check:
    if: ${{ github.ref == 'refs/heads/main' && (vars.MAINNET_WATCH_ENABLED == 'true' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'preview')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      OPS_ACTOR_ID: ${{ vars.MAINNET_OPS_BOT_ACTOR_ID }}
      WATCH_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'production' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Require an alert channel
        env:
          ALERT_WEBHOOK: ${{ secrets.MAINNET_WATCHER_ALERT_WEBHOOK }}
        run: test -n "$ALERT_WEBHOOK"
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Report preview runner address and test alert delivery
        if: ${{ env.WATCH_MODE == 'preview' }}
        env:
          ALERT_WEBHOOK: ${{ secrets.MAINNET_WATCHER_ALERT_WEBHOOK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          ip="$(curl -4 --fail --silent --show-error --max-time 15 https://checkip.amazonaws.com)"
          python3 - "$ip" <<'PY'
          import ipaddress, sys
          address = ipaddress.ip_address(sys.argv[1])
          if address.version != 4 or not address.is_global:
              raise SystemExit('Runner does not have a public IPv4 address')
          PY
          printf 'Allow preview access for runner IP %s, then keep this job running.\n' "$ip" | tee -a "$GITHUB_STEP_SUMMARY"
          payload="$(python3 -c 'import json,os; print(json.dumps({"text":"MinaGuard watcher preview alert test: " + os.environ["RUN_URL"]}))')"
          curl --fail --silent --output /dev/null --max-time 15 --retry 2 \
            --header 'Content-Type: application/json' --data "$payload" "$ALERT_WEBHOOK"

      - name: Wait for restricted preview
        if: ${{ env.WATCH_MODE == 'preview' }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            code="$(curl -4 --silent --output /dev/null --max-time 10 --write-out '%{http_code}' https://app.minaguard.com/ || true)"
            if [[ "$code" == 200 ]]; then exit 0; fi
            sleep 10
          done
          echo 'Preview was not available to this runner within 15 minutes.' >&2
          exit 1

      - name: Verify approved release and check public bytes
        id: watch
        continue-on-error: true
        run: |
          set -euo pipefail
          environment=mainnet
          if [[ "$WATCH_MODE" == preview ]]; then environment=mainnet-preview; fi
          python3 deploy/resolve-mainnet-deployment.py --ops-actor-id "$OPS_ACTOR_ID" --environment "$environment" \
            > "$RUNNER_TEMP/deployed-release.json"
          read -r APPROVED_SHA APPROVED_RUN_ID APPROVED_MANIFEST_SHA256 < <(
            python3 - "$RUNNER_TEMP/deployed-release.json" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding='utf-8') as source:
              release = json.load(source)
          print(release['sourceSha'], release['runId'], release['manifestSha256'])
          PY
          )
          [[ "$APPROVED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'Invalid approved SHA' >&2; exit 1; }
          [[ "$APPROVED_RUN_ID" =~ ^[1-9][0-9]*$ ]] || { echo 'Invalid approved run ID' >&2; exit 1; }
          [[ "$APPROVED_MANIFEST_SHA256" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo 'Invalid approved manifest hash' >&2; exit 1; }
          export APPROVED_SHA APPROVED_RUN_ID APPROVED_MANIFEST_SHA256
          check_preview_head() {
            gh api repos/zksecurity/mina-guard/branches/production | \
              jq -e --arg sha "$APPROVED_SHA" '.protected == true and .commit.sha == $sha' >/dev/null
          }
          if [[ "$WATCH_MODE" == preview ]]; then check_preview_head; fi
          release_dir="$RUNNER_TEMP/mainnet-release"
          mkdir -p "$release_dir"
          verifier=deploy/verify-mainnet-release.py
          bundle_args=(--bundle-dir "$release_dir")
          if ! gh release download "mainnet-build-$APPROVED_SHA-$APPROVED_RUN_ID" --dir "$release_dir"; then
            python3 deploy/prepare-legacy-watch.py --sha "$APPROVED_SHA" --run-id "$APPROVED_RUN_ID" --directory "$release_dir"
            verifier="$release_dir/legacy-verifier.py"
            bundle_args=()
          fi
          python3 "$verifier" \
            --manifest "$release_dir/mainnet-images.json" \
            --content-manifest "$release_dir/mainnet-content.json" \
            --approved-sha "$APPROVED_SHA" \
            --approved-manifest-sha256 "$APPROVED_MANIFEST_SHA256" \
            "${bundle_args[@]}" \
            > "$RUNNER_TEMP/verified-mainnet-release.json"
          python3 deploy/mainnet-content-integrity.py check \
            --manifest "$release_dir/mainnet-content.json" \
            --base-url https://app.minaguard.com
          if [[ "$WATCH_MODE" == preview ]]; then check_preview_head; fi

      - name: Alert on changed content or failed check
        if: ${{ failure() || steps.watch.outcome == 'failure' }}
        env:
          ALERT_WEBHOOK: ${{ secrets.MAINNET_WATCHER_ALERT_WEBHOOK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          test -n "$ALERT_WEBHOOK" || { echo 'MAINNET_WATCHER_ALERT_WEBHOOK is not configured' >&2; exit 1; }
          payload="$(python3 -c 'import json, os; print(json.dumps({"text": "MinaGuard public-content check failed: " + os.environ["RUN_URL"]}))')"
          curl --fail --silent --output /dev/null --max-time 15 --retry 2 \
            --header 'Content-Type: application/json' --data "$payload" "$ALERT_WEBHOOK"

      - name: Mark check failed
        if: ${{ failure() || steps.watch.outcome == 'failure' }}
        run: exit 1
